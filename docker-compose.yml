# Hotel Manager — Production Docker Compose (Ubuntu VPS)
#
# Stack: Nginx (TLS termination + reverse proxy) -> web (Next.js) + api (Express)
# Database: external Supabase Postgres (not containerized)
# Cache: Redis container (local, not exposed to the internet)
#
# Setup:
#   1. cp backend/.env.production.example backend/.env.production   (fill in Supabase + secrets)
#   2. cp .env.example .env                                          (set DOMAIN, LETSENCRYPT_EMAIL, build args)
#   3. bash init-letsencrypt.sh     (first-time only — issues the SSL certificate)
#   4. docker compose up -d --build
#
# Usage:
#   docker compose up -d --build      # build and start everything
#   docker compose logs -f api        # tail backend logs
#   docker compose restart nginx      # reload nginx after a config change
#   docker compose down               # stop everything (data volumes persist)

services:
  # ============================================
  # CACHE (Redis — internal only, not published to host)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API (Express + Sequelize -> Supabase Postgres)
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================
  # WEB (Next.js)
  # ============================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    container_name: hotel-web
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy

  # ============================================
  # NGINX (reverse proxy + TLS termination)
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: hotel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_active_conf:/etc/nginx/conf.d
    entrypoint: >
      sh -c "
        if [ -f /etc/letsencrypt/live/$$DOMAIN/fullchain.pem ]; then
          echo 'Certificate found — using full HTTPS config';
          envsubst '$$DOMAIN' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf;
        else
          echo 'No certificate yet — using HTTP-only bootstrap config';
          envsubst '$$DOMAIN' < /etc/nginx/templates/app-bootstrap.conf.template > /etc/nginx/conf.d/app.conf;
        fi &&
        exec nginx -g 'daemon off;'
      "
    depends_on:
      - web
      - api

  # ============================================
  # CERTBOT (renews the Let's Encrypt certificate every 12h)
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: hotel-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  redis_data:
  uploads_data:
  nginx_active_conf:
