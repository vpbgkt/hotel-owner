# Hotel Manager — Production Docker Compose (Ubuntu VPS)
#
# Stack: Nginx (internal reverse proxy, HTTP only) -> web (Next.js) + api (Express)
# TLS termination happens on the HOST's existing Nginx (shared with other sites
# on this VPS) — this container's nginx only listens on 127.0.0.1, never on
# the public 80/443, so it never conflicts with anything else on the box.
# Database: external Supabase Postgres (not containerized)
# Cache: Redis container (local, not exposed to the internet)
#
# Setup:
#   1. cp backend/.env.production.example backend/.env.production   (fill in Supabase + secrets)
#   2. cp .env.example .env                                          (set HOTEL_NGINX_PORT, build args)
#   3. docker compose up -d --build
#   4. Add a server block to the HOST nginx that proxies the domain to
#      127.0.0.1:${HOTEL_NGINX_PORT} (see deployment notes) and issue the
#      cert with your existing host-level certbot flow.
#
# Usage:
#   docker compose up -d --build      # build and start everything
#   docker compose logs -f api        # tail backend logs
#   docker compose restart nginx      # reload nginx after a config change
#   docker compose down               # stop everything (data volumes persist)

services:
  # ============================================
  # CACHE (Redis — internal only, not published to host)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API (Express + Sequelize -> Supabase Postgres)
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================
  # WEB (Next.js)
  # ============================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    container_name: hotel-web
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:4000/api
    depends_on:
      api:
        condition: service_healthy

  # ============================================
  # NGINX (internal reverse proxy — HTTP only, loopback-bound)
  # No TLS here — the host's existing Nginx terminates TLS and proxies to
  # 127.0.0.1:${HOTEL_NGINX_PORT}, exactly like your other two sites.
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: hotel-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOTEL_NGINX_PORT:-8081}:80"
    volumes:
      # Mounted straight into conf.d — no envsubst needed since this template
      # has no ${VARS} to substitute (TLS/DOMAIN live on the host nginx now).
      # Running envsubst unrestricted here previously blanked out nginx's own
      # runtime variables ($host, $scheme, etc.), corrupting the config.
      - ./nginx/conf.d/app-internal.conf.template:/etc/nginx/conf.d/app.conf:ro
    depends_on:
      - web
      - api

volumes:
  redis_data:
  uploads_data:
